<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141414">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Karabacak Stok">
<title>Karabacak Stok</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#f6f6f6; --surface:#ffffff; --ink:#141414; --muted:#6b7280; --line:#e5e7eb; --soft:#f0f0f0;
  --dark:#141414; --dark-ink:#ffffff; --accent:#c4302b; --accent-ink:#ffffff; --accent-soft:#fbe9e8;
  --ok:#15803d; --ok-bg:#e7f6ec; --warn:#b45309; --warn-bg:#fef3c7; --bad:#b91c1c; --bad-bg:#fee2e2;
  --r:14px; --sh:0 1px 3px rgba(0,0,0,.05);
  --font:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--font);font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.top{background:var(--dark);color:var(--dark-ink);position:sticky;top:0;z-index:6;padding-top:env(safe-area-inset-top)}
header.top .wrap{display:flex;align-items:center;gap:10px;height:56px}
.mark{width:26px;height:26px;flex:none}
h1{font-size:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:0;flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.12)}
.pill b{font-weight:600}.pill span{opacity:.7}
main{padding-top:16px;padding-bottom:calc(128px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
h2{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em}
h3{font-size:13px;font-weight:700;margin:0;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .small{font-size:13px} .b{font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;text-align:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--dark);border-color:var(--dark);color:var(--dark-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{min-height:44px;padding:0 14px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:8px 0;color:var(--accent);font-weight:600;text-decoration:underline;min-height:44px}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.field input,.field select,.inp{min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0 12px;font-size:16px;width:100%}
.inp.num{width:104px;text-align:right;font-weight:700}
.form{display:flex;flex-direction:column;gap:12px}
.center{max-width:420px;margin:28px auto 0}
/* ana sayfa */
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:360px){.acts{grid-template-columns:1fr}}
.act{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:18px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:var(--sh);cursor:pointer;min-height:124px}
.act svg.ic{width:30px;height:30px}
.act b{font-size:18px;line-height:1.15}
.act span{font-size:13px;opacity:.8}
.act.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.act:focus-within{outline:3px solid var(--accent);outline-offset:2px}
/* liste */
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);min-height:56px;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.item:first-child{border-top:0}
.nm{font-weight:600;overflow-wrap:anywhere}
.qty{text-align:right;white-space:nowrap;font-weight:700;font-size:22px;line-height:1.05}
.qty small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.qty.neg{color:var(--bad)}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.note{border-radius:12px;padding:10px 12px;font-size:14px;background:var(--soft)}
.note.warn{background:var(--warn-bg);color:var(--warn)} .note.bad{background:var(--bad-bg);color:var(--bad)} .note.ok{background:var(--ok-bg);color:var(--ok)}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi button{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;text-align:left;box-shadow:var(--sh);min-height:64px}
.kpi b{display:block;font-size:24px;line-height:1.1}
.kpi span{font-size:12px;color:var(--muted)}
.search{position:relative}
.search svg.ic{position:absolute;left:12px;top:13px;color:var(--muted)}
.search input{padding-left:42px;padding-right:46px}
.search button{position:absolute;right:2px;top:2px;width:44px;height:44px;border:0;background:none;color:var(--muted);font-size:22px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;min-height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.chips button[aria-pressed="true"]{background:var(--dark);color:var(--dark-ink);border-color:var(--dark)}
.skel{height:56px;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px}
.skel i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,#ececec,#f7f7f7,#ececec);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel i,.spin{animation:none}}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty svg.ic{width:36px;height:36px;margin-bottom:6px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:var(--r);padding:10px 12px;display:flex;align-items:center;gap:10px;font-weight:600}
.diff{font-size:12px;font-weight:700;text-align:right;min-height:16px}
.diff.neg{color:var(--bad)} .diff.pos{color:var(--ok)} .diff.zero{color:var(--muted);font-weight:500}
.bar{position:sticky;bottom:calc(98px + env(safe-area-inset-bottom));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.14);z-index:4}
/* taslak satırı */
.ln{border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface);box-shadow:var(--sh)}
.ln.kontrol{border-left-color:#f59e0b} .ln.eksik{border-left-color:var(--accent)} .ln.dis{border-left-color:#9ca3af;opacity:.85}
.prod{display:flex;justify-content:space-between;gap:8px;align-items:center;width:100%;min-height:48px;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:6px 12px;font-weight:600}
.prod.bos{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tog{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:14px}
.tog input{width:22px;height:22px;accent-color:var(--accent)}
.x{border:0;background:none;font-size:24px;line-height:1;min-width:44px;min-height:44px;color:var(--muted)}
.photo img{max-width:100%;border-radius:12px;display:block}
.photo summary{cursor:pointer;font-weight:600;min-height:36px}
.spin{width:20px;height:20px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.three div{background:var(--bg);border-radius:12px;padding:10px 6px}
.three b{display:block;font-size:22px;line-height:1.1}
.three span{font-size:12px;color:var(--muted)}
.three .main{background:var(--dark);color:var(--dark-ink)} .three .main span{color:rgba(255,255,255,.7)}
.av{width:40px;height:40px;border-radius:50%;background:var(--dark);color:var(--dark-ink);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
/* alt menü */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5}
nav.tabs .wrap{display:flex;padding:6px 6px calc(12px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;border:0;background:none;min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:13.5px;color:var(--muted);position:relative;padding:0 2px}
nav.tabs svg.ic{width:28px;height:28px;stroke-width:2}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs .dot{position:absolute;top:6px;left:calc(50% + 10px);min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
/* paneller */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:760px;max-height:90%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
#secici .sheet-bg{z-index:12}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(108px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;background:var(--dark);color:var(--dark-ink);padding:11px 16px;border-radius:999px;z-index:20;max-width:92%;font-weight:500;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.ok svg.ic{color:#4ade80} .toast.bad svg.ic{color:#f87171}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 4px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;border-top:0}
td.r,th.r{text-align:right;white-space:nowrap}
.hidden{display:none}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <svg class="mark" viewBox="0 0 30 30" aria-hidden="true"><path d="M3 17 15 6l12 11v-5L15 1 3 12z" fill="#e2524b"/><path d="M3 27 15 16l12 11v-5L15 11 3 22z" fill="#e2524b"/></svg>
  <h1>Karabacak Stok</h1><div id="who"></div>
</div></header>
<div class="wrap"><main id="app"><p class="muted">Yükleniyor…</p></main></div>
<nav class="tabs hidden" id="tabs" aria-label="Bölümler"><div class="wrap" id="tabbar"></div></nav>
<div id="sheet"></div><div id="secici"></div><div id="toast"></div>
<input type="file" id="f-satis-k" accept="image/*" capture="environment" hidden>
<input type="file" id="f-satis-d" accept="image/*" hidden>
<input type="file" id="f-alis-k" accept="image/*" capture="environment" hidden>
<input type="file" id="f-alis-d" accept="image/*" hidden>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js?v=3"></script>
</body>
</html>
